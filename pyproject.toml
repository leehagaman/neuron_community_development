[project]
name = "neuron-community-development"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Lee Hagaman", email = "hagamanlee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
